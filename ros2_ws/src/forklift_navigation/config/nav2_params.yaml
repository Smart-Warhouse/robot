# Nav2 (Humble) for the 1:14 forklift — requirements §7 (NV-05 .. NV-12).
# Loaded by forklift_navigation/launch/navigation.launch.py through nav2_common RewrittenYaml(root_key=<robot ns>),
# so the keys below get the /flN prefix. All topics are relative (resolved inside /flN).
# Geometry is PLACEHOLDER until ME-01: footprint = forklift_mission.footprint(dimensions.yaml) unloaded
# (checked by src/forklift_mission/test/test_footprint_lift.py); the loaded polygon is published at run time by
# mission_node on local_costmap/footprint and global_costmap/footprint (NV-12).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # default_nav_to_pose_bt_xml is set by the launch file to behavior_trees/navigate_lane.xml (no Spin: Ackermann)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0                 # NV-06
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: odometry/filtered
    speed_limit_topic: speed_limit             # from the speed filter (NV-08)
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05                  # NV-11: 5 cm
      yaw_goal_tolerance: 0.0873               # NV-11: 5 deg
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController   # NV-06
      desired_linear_vel: 0.25                 # NFR-03 cap 0.3 m/s (the safety supervisor clamps again)
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true    # slow down in turns
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true   # slow down near obstacles
      cost_scaling_dist: 0.2
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0
      use_rotate_to_heading: false             # Ackermann: cannot turn on the spot
      allow_reversing: true                    # Hybrid-A* Reeds-Shepp paths contain reverse segments
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 3.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.02                         # NV-01 cell size
      footprint: "[[-0.3, -0.0935], [0.03, -0.0935], [0.03, -0.0625], [0.21, -0.0625], [0.21, 0.0625], [0.03, 0.0625], [0.03, 0.0935], [-0.3, 0.0935]]"
      footprint_padding: 0.01
      plugins: [obstacle_layer, inflation_layer]
      filters: [keepout_filter]
      obstacle_layer:                          # PC-10: new obstacles from the LiDAR
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan_filtered                 # laser_filters output (PC-09: own mast/pillars removed)
          data_type: LaserScan
          marking: true
          clearing: true
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          max_obstacle_height: 2.0
      inflation_layer:                         # NV-07: >= half width (0.0935) + 3 cm
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 6.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: keepout_costmap_filter_info
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.02
      track_unknown_space: true
      footprint: "[[-0.3, -0.0935], [0.03, -0.0935], [0.03, -0.0625], [0.21, -0.0625], [0.21, 0.0625], [0.03, 0.0625], [0.03, 0.0935], [-0.3, 0.0935]]"
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      filters: [keepout_filter, speed_filter]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan_filtered
          data_type: LaserScan
          marking: true
          clearing: true
          raytrace_max_range: 4.0
          obstacle_max_range: 3.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.15
        cost_scaling_factor: 6.0
      keepout_filter:                          # NV-08 keep-out zones (maps/keepout_mask.*)
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: keepout_costmap_filter_info
      speed_filter:                            # NV-08 speed zones (maps/speed_mask.*, % of max speed)
        plugin: nav2_costmap_2d::SpeedFilter
        enabled: true
        filter_info_topic: speed_costmap_filter_info
        speed_limit_topic: speed_limit
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid   # NV-05: Hybrid-A*, turning radius + reversing
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.05
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: REEDS_SHEPP     # forward + reverse (forks in, back out)
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.0
      minimum_turning_radius: 0.35             # PLACEHOLDER: wheelbase 0.20 / tan(30 deg) = 0.346 m; measure (EN-01)
      reverse_penalty: 1.5
      change_penalty: 0.2
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 5.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [backup, drive_on_heading, wait]   # no spin: Ackermann
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

# Costmap filter masks (NV-08) — map_server + costmap_filter_info_server pairs; yaml_filename set by the launch file.
keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    topic_name: keepout_filter_mask
    frame_id: map

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0                                    # keep-out
    filter_info_topic: keepout_costmap_filter_info
    mask_topic: keepout_filter_mask
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    topic_name: speed_filter_mask
    frame_id: map

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 1                                    # speed limit in % of the maximum
    filter_info_topic: speed_costmap_filter_info
    mask_topic: speed_filter_mask
    base: 0.0
    multiplier: 1.0
