; ESP32-S3 firmware for the autonomous 1:14 forklift (requirements §3, §4, §9, §10).
;
;   pio test -e native            host unit tests of lib/forklift_core (Unity, needs a host gcc/g++)
;   pio run  -e esp32s3           board build WITHOUT micro-ROS (bench console on USB CDC)
;   pio run  -e esp32s3_microros  board build WITH micro-ROS over USB CDC (see README: needs Linux/WSL)

[platformio]
default_envs = esp32s3

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17

; ---------------------------------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32
framework = arduino
; Waveshare ESP32-S3 Zero: ESP32-S3FH4R2 (4 MB flash, 2 MB PSRAM), native USB on GPIO 19/20.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    pololu/VL53L1X@^1.3.1
    adafruit/Adafruit NeoPixel@^1.12.0
test_ignore = *

; ---------------------------------------------------------------------------------------------------
; micro-ROS build. The micro_ros_platformio builder runs POSIX shell commands (". venv/bin/activate",
; backticks) and breaks on paths with spaces and on Windows MAX_PATH — build this env on Linux / WSL2
; (see README). FL_ENABLE_MICROROS switches src/microros_node.cpp on; without it the firmware still runs
; safely on its own (FW-09). microros.meta raises the entity limits (6 subscriptions + parameter server).
[env:esp32s3_microros]
extends = env:esp32s3
board_microros_distro = humble
board_microros_transport = serial
board_microros_user_meta = microros.meta
build_flags =
    ${env:esp32s3.build_flags}
    -DFL_ENABLE_MICROROS=1
lib_deps =
    ${env:esp32s3.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio

; ---------------------------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wall
    -Wextra
    -DFL_NATIVE=1
lib_ldf_mode = deep+
